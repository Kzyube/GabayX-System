<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GabayX | Command Center Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#020806">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script src="/js/pwa.js"></script>
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('gabayx_theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <style>
        :root, [data-theme="dark"] {
            --base-bg: #060d09;
            --surface: #0c1712;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(16, 185, 129, 0.4);
            --input-bg: rgba(0, 0, 0, 0.4);
            --input-border: rgba(255, 255, 255, 0.1);
            --emerald-500: #10b981;
            --emerald-400: #34d399;
            --accent-cyan: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --font-ui: 'Outfit', sans-serif;
            --font-data: 'Space Mono', monospace;
        }

        [data-theme="light"], body.light-mode {
            --base-bg: #f8fafc;
            --surface: #ffffff;
            --border-subtle: #e2e8f0;
            --border-highlight: rgba(5, 150, 105, 0.4);
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --emerald-500: #059669;
            --emerald-400: #047857;
            --accent-cyan: #059669;
            --text-main: #0f172a;
            --text-muted: #475569;
            --danger: #dc2626;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="light"] .mesh-bg {
            background: #f1f5f9;
        }
        [data-theme="light"] .mesh-blob {
            opacity: 0.12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ui);
        }

        body {
            background-color: var(--base-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            background: var(--base-bg);
            overflow: hidden;
        }

        .mesh-blob {
            position: absolute;
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.3;
        }

        .blob-1 {
            background: #064e3b;
            width: 60vw; height: 60vw;
            top: -20%; right: -10%;
        }

        .blob-2 {
            background: #022c22;
            width: 50vw; height: 50vw;
            bottom: -20%; left: -20%;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2.25rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--card-shadow);
            position: relative;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .logo-mark {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
        }

        .brand-text {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .badge-admin {
            display: inline-block;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 800;
            font-family: var(--font-data);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .header-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            text-align: center;
            color: var(--text-main);
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.75rem;
            text-align: center;
            line-height: 1.45;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: var(--font-data);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: 0.2s;
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        input:focus {
            border-color: var(--emerald-500);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--emerald-500);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.95;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: var(--emerald-500);
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            margin-bottom: 1.25rem;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="mesh-bg">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
    </div>

    <div class="auth-card">
        <div style="text-align: center;">
            <span class="badge-admin">Command Portal</span>
        </div>

        <div class="brand-header">
            <img src="/GabayXLOGO.jpg" class="logo-mark" alt="GabayX Logo">
            <span class="brand-text">GABAYX</span>
        </div>

        <h2 class="header-title">Command Center Login</h2>
        <p class="header-subtitle">Authorized school and response personnel only. Citizens can access emergency reporting directly.</p>

        <div id="error-box" class="error-banner"></div>

        <form action="/auth/login" method="POST">
            <div class="form-group">
                <label for="username">Administrator Username</label>
                <input type="text" id="username" name="username" placeholder="e.g. admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Sign In to Command Center</button>
        </form>

        <a href="/" class="back-link">&larr; Return to Public Emergency Dashboard</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) {
            const errBox = document.getElementById('error-box');
            errBox.style.display = 'block';
            errBox.innerText = 'Invalid administrator credentials. Please try again.';
        }
    </script>
</body>
</html>
